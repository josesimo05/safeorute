[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saferoute-its"
version = "0.1.0"
description = "Piloto ITS de una cámara con mediciones y calidad explícita"
requires-python = ">=3.12,<3.14"
dependencies = [
  "av==19.0.2", "fastapi==0.162.0", "numpy==2.2.6",
  "onnxruntime==1.22.1", "opencv-python==4.11.0.86",
  "pydantic==2.14.2", "psycopg[binary]==3.3.6",
  "SQLAlchemy==2.1.6", "supervision==0.26.1", "uvicorn[standard]==0.54.0"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<0.29"]

[project.scripts]
saferoute-its = "traffic_its.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traffic_its = ["static/**/*", "static/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
